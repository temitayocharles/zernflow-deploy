name: Build immutable ZernFlow runtime

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact ZernFlow source commit SHA
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment automation
        uses: actions/checkout@v4

      - name: Checkout exact ZernFlow source
        uses: actions/checkout@v4
        with:
          repository: temitayocharles/zernflow
          ref: ${{ inputs.source_sha }}
          path: src
          persist-credentials: false

      - name: Install deployment Dockerfile
        run: cp Dockerfile src/Dockerfile.deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact-SHA image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile.deploy
          push: true
          tags: ghcr.io/temitayocharles/zernflow-runtime:${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/temitayocharles/zernflow-deploy
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_SUPABASE_URL=https://pamemznxfsuouiajusoj.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_jt8ZidesDwZt8Tmx85-eoA_SrGLJdBh
            NEXT_PUBLIC_APP_URL=https://http--zernflow--5779gkgwrk2d.code.run
          cache-from: type=gha
          cache-to: type=gha,mode=max
